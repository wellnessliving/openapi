name: Release

on:
  push:
    branches:
      - main
    paths:
      - production/openapi.yaml
      - stable/openapi.yaml
      - dev/openapi.yaml

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract versions
        id: version
        run: |
          PRODUCTION=$(grep -m1 'version:' production/openapi.yaml | awk '{print $2}' | tr -d "'")
          STABLE=$(grep -m1 'version:' stable/openapi.yaml | awk '{print $2}' | tr -d "'")
          DEV=$(grep -m1 'version:' dev/openapi.yaml | awk '{print $2}' | tr -d "'")
          echo "production=$PRODUCTION" >> $GITHUB_OUTPUT
          echo "stable=$STABLE" >> $GITHUB_OUTPUT
          echo "dev=$DEV" >> $GITHUB_OUTPUT

      - name: Detect changed files
        id: changed
        run: |
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git show --name-only --format='' HEAD > changed.txt
            REF_BASE="HEAD^"
          else
            git diff --name-only "$BASE" HEAD > changed.txt
            REF_BASE="$BASE"
          fi

          # Skip release if the file's only change is its `version:` line.
          release_needed() {
            FILE="$1"
            if ! grep -qxF "$FILE" changed.txt; then
              echo 0
              return
            fi
            OLD=$(git show "$REF_BASE:$FILE" 2>/dev/null | grep -v '^\s*version:')
            NEW=$(git show "HEAD:$FILE" | grep -v '^\s*version:')
            if [ "$OLD" = "$NEW" ]; then
              echo 0
            else
              echo 1
            fi
          }

          echo "production=$(release_needed production/openapi.yaml)" >> $GITHUB_OUTPUT
          echo "stable=$(release_needed stable/openapi.yaml)" >> $GITHUB_OUTPUT
          echo "dev=$(release_needed dev/openapi.yaml)" >> $GITHUB_OUTPUT

      - name: Release production
        if: steps.changed.outputs.production != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: production/v${{ steps.version.outputs.production }}
          name: production/v${{ steps.version.outputs.production }}
          make_latest: true
          files: production/openapi.yaml

      - name: Update latest tag
        if: steps.changed.outputs.production != '0'
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Release stable
        if: steps.changed.outputs.stable != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable/v${{ steps.version.outputs.stable }}
          name: stable/v${{ steps.version.outputs.stable }}
          make_latest: false
          files: stable/openapi.yaml

      - name: Release dev
        if: steps.changed.outputs.dev != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev/v${{ steps.version.outputs.dev }}
          name: dev/v${{ steps.version.outputs.dev }}
          make_latest: false
          files: dev/openapi.yaml